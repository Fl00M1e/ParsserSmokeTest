name: Release macOS (Developer ID + notarization)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: ParserOnSocial-mac-arm64-signed
          - runner: macos-15-intel
            arch: x86_64
            artifact: ParserOnSocial-mac-x86_64-signed

    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      MAC_ARCH: ${{ matrix.arch }}
      APP_NAME: ParserOnSocial
      KEYCHAIN_NAME: parseronsocial-signing.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify signing secrets are configured
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in P12 P12_PASSWORD KEYCHAIN_PASSWORD TEAM_ID KEY_ID ISSUER_ID API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for signed release: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'Configure the Developer ID + App Store Connect secrets described in README-MAC-SIGNING.md.'
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/parseronsocial-signing.keychain-db
          CERT_PATH: ${{ runner.temp }}/developer-id-application.p12
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, pathlib
          out = pathlib.Path(os.environ['CERT_PATH'])
          out.write_bytes(base64.b64decode(os.environ['CERTIFICATE_BASE64']))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Find Developer ID identity
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo 'ERROR: Developer ID Application identity was not found in the imported keychain.' >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using signing identity: $IDENTITY"

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          chmod +x build/build_mac.sh build/sign_macos.sh
          build/build_mac.sh

      - name: Sign .app with Developer ID Application
        run: |
          set -euo pipefail
          build/sign_macos.sh "build/dist/$APP_NAME.app"

      - name: Validate signed app before notarization
        run: |
          set -euo pipefail
          APP="build/dist/$APP_NAME.app"
          BIN="$APP/Contents/MacOS/$APP_NAME"
          echo '--- Main executable ---'
          file "$BIN"
          echo '--- Architectures ---'
          lipo -archs "$BIN"
          echo '--- Signature ---'
          codesign --display --verbose=4 "$APP" 2>&1
          echo '--- Strict verification ---'
          codesign --verify --deep --strict --verbose=4 "$APP"
          echo '--- Entitlements ---'
          codesign -d --entitlements :- "$APP" 2>&1 || true

      - name: Smoke test — signed app before notarization
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/dist/$APP_NAME.app"
          BIN="$APP/Contents/MacOS/$APP_NAME"
          LOG_DIR="$PWD/build/smoke-test"
          mkdir -p "$LOG_DIR"
          "$BIN" --self-test 2>&1 | tee "$LOG_DIR/signed-selftest.txt"
          open "$APP" 2>&1 | tee "$LOG_DIR/signed-launch.txt" || true
          running=0
          for i in {1..20}; do
            if pgrep -x "$APP_NAME" >/dev/null 2>&1; then
              running=1
              echo "Application process detected after ${i}s." | tee -a "$LOG_DIR/signed-launch.txt"
              break
            fi
            sleep 1
          done
          if [[ "$running" -ne 1 ]]; then
            log show --style compact --last 90s --predicate 'process == "ParserOnSocial"' 2>&1 | tee "$LOG_DIR/macos-log.txt" || true
            exit 1
          fi
          pkill -f "$APP_NAME.app/Contents/MacOS/$APP_NAME" || true

      - name: Create notarization ZIP
        run: |
          set -euo pipefail
          cd build/dist
          rm -f "${APP_NAME}-mac-${MAC_ARCH}-unsigned.zip" "${APP_NAME}-mac-${MAC_ARCH}-notarization-input.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "${APP_NAME}-mac-${MAC_ARCH}-notarization-input.zip"

      - name: Prepare App Store Connect API key for notarytool
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          out.write_bytes(base64.b64decode(os.environ['API_KEY_BASE64']))
          print(out)
          PY
          echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Submit to Apple notarization service
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit \
            "build/dist/${APP_NAME}-mac-${MAC_ARCH}-notarization-input.zip" \
            --key "$NOTARY_API_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json | tee build/notarytool-submit.json

      - name: Staple and validate notarization ticket
        run: |
          set -euo pipefail
          APP="build/dist/$APP_NAME.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Create final notarized ZIP
        run: |
          set -euo pipefail
          cd build/dist
          rm -f "${APP_NAME}-mac-${MAC_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "${APP_NAME}-mac-${MAC_ARCH}.zip"
          shasum -a 256 "${APP_NAME}-mac-${MAC_ARCH}.zip" | tee "${APP_NAME}-mac-${MAC_ARCH}.zip.sha256"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p build/release-diagnostics
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" > build/release-diagnostics/identities.txt 2>&1 || true
          codesign --display --verbose=4 "build/dist/$APP_NAME.app" > build/release-diagnostics/codesign.txt 2>&1 || true
          xcrun stapler validate "build/dist/$APP_NAME.app" > build/release-diagnostics/stapler.txt 2>&1 || true
          spctl --assess --type execute --verbose=4 "build/dist/$APP_NAME.app" > build/release-diagnostics/spctl.txt 2>&1 || true
          cat build/notarytool-submit.json > build/release-diagnostics/notarytool-submit.json 2>/dev/null || true

      - name: Upload signed notarized artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/dist/${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip
            build/dist/${{ env.APP_NAME }}-mac-${{ matrix.arch }}.zip.sha256

      - name: Upload signing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: build/release-diagnostics
          if-no-files-found: warn

      - name: Clean temporary key material
        if: always()
        run: |
          rm -f "$NOTARY_API_KEY_PATH" || true
          security delete-keychain "$KEYCHAIN_PATH" || true
